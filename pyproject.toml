[project]
name = "fin-data"
version = "0.1.0"
description = "Financial data collection system with a medallion architecture"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",
    "httpx==0.27.0",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-mock==3.14.0",
    "responses==0.25.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
